name: classroom_app
description: Classroom learning app with clean architecture and BLoC.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # DI
  get_it: ^7.7.0

  # Video Player (for splash screen background)
  video_player: ^2.9.1

  # Form Validation
  formz: ^0.7.0

  # Navigation
  go_router: ^14.2.7

  # UI
  gap: ^3.0.1
  cupertino_icons: ^1.0.6
  pinput: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/images/
